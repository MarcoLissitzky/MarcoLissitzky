<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="Economics → Linguistics → NLP. Six oracle-bone characters drawn stroke by stroke, each followed by its Old Chinese reconstruction.">
<style>
